name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements/requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff checks
        run: ruff check app tests alembic

      - name: Check formatting
        run: ruff format --check app tests alembic
